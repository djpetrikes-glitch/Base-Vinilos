function parseWavHeader(buffer) {
  const view = new DataView(buffer);
  if (view.getUint32(0, false) !== 0x52494646) throw new Error('No es un WAV válido (falta cabecera RIFF)');
  if (view.getUint32(8, false) !== 0x57415645) throw new Error('No es un WAV válido (falta cabecera WAVE)');
  let offset = 12;
  let fmt = null, dataOffset = null, dataLength = null;
  while (offset + 8 <= view.byteLength) {
    const chunkId = view.getUint32(offset, false);
    const chunkSize = view.getUint32(offset + 4, true);
    if (chunkId === 0x666d7420) { // 'fmt '
      fmt = {
        audioFormat: view.getUint16(offset + 8, true),
        numChannels: view.getUint16(offset + 10, true),
        sampleRate: view.getUint32(offset + 12, true),
        bitsPerSample: view.getUint16(offset + 22, true),
      };
    } else if (chunkId === 0x64617461) { // 'data'
      dataOffset = offset + 8;
      dataLength = Math.min(chunkSize, view.byteLength - dataOffset);
    }
    offset += 8 + chunkSize + (chunkSize % 2);
  }
  if (!fmt) throw new Error('No se encontró el bloque "fmt " en el WAV');
  if (dataOffset == null) throw new Error('No se encontraron datos de audio en el WAV');
  return { fmt, dataOffset, dataLength };
}

// Calcula un "envolvente" de amplitud (RMS por ventana) sin duplicar todo el audio en memoria
function computeEnvelope(buffer, fmt, dataOffset, dataLength, windowMs) {
  const { sampleRate, numChannels, bitsPerSample, audioFormat } = fmt;
  const bytesPerSample = bitsPerSample / 8;
  const frameSize = bytesPerSample * numChannels;
  const totalFrames = Math.floor(dataLength / frameSize);
  const windowFrames = Math.max(1, Math.round(sampleRate * windowMs / 1000));
  const numWindows = Math.max(1, Math.ceil(totalFrames / windowFrames));
  const envelope = new Float32Array(numWindows);
  const view = new DataView(buffer);

  function readSample(byteOffset) {
    if (audioFormat === 3) return view.getFloat32(byteOffset, true);
    if (bitsPerSample === 16) return view.getInt16(byteOffset, true) / 32768;
    if (bitsPerSample === 24) {
      const b0 = view.getUint8(byteOffset), b1 = view.getUint8(byteOffset + 1), b2 = view.getUint8(byteOffset + 2);
      let val = (b2 << 16) | (b1 << 8) | b0;
      if (val & 0x800000) val -= 0x1000000;
      return val / 8388608;
    }
    if (bitsPerSample === 32) return view.getInt32(byteOffset, true) / 2147483648;
    if (bitsPerSample === 8) return (view.getUint8(byteOffset) - 128) / 128;
    return 0;
  }

  for (let w = 0; w < numWindows; w++) {
    const startFrame = w * windowFrames;
    const endFrame = Math.min(totalFrames, startFrame + windowFrames);
    const step = Math.max(1, Math.floor((endFrame - startFrame) / 200)); // muestreo, no cada sample
    let sumSq = 0, count = 0;
    for (let f = startFrame; f < endFrame; f += step) {
      const byteOffset = dataOffset + f * frameSize;
      let val = 0;
      for (let ch = 0; ch < numChannels; ch++) val += readSample(byteOffset + ch * bytesPerSample);
      val /= numChannels;
      sumSq += val * val;
      count++;
    }
    envelope[w] = count ? Math.sqrt(sumSq / count) : 0;
  }
  return { envelope, windowMs };
}

// Calcula un umbral de silencio a medida de esta grabación en concreto, en vez de
// usar siempre el mismo valor fijo: mira cuál es el "suelo de ruido" real (percentil
// bajo de la envolvente) y pone el umbral unos dB por encima de ese suelo.
function computeAdaptiveThresholdDb(envelope, marginDb) {
  const sorted = Array.from(envelope).filter(v => v > 0).sort((a, b) => a - b);
  if (!sorted.length) return -45;
  // Usar un número FIJO de ventanas más silenciosas (no un porcentaje) — así funciona
  // igual de bien tanto si la grabación tiene mucho silencio como si tiene muy poco.
  const k = Math.min(sorted.length - 1, 15);
  const noiseFloorDb = 20 * Math.log10(Math.max(sorted[k], 1e-6));
  return noiseFloorDb + marginDb;
}

function detectSegments(envelope, windowMs, thresholdDb, minSilenceSec, totalDurationSec) {
  const threshold = Math.pow(10, thresholdDb / 20);
  const minSilenceWindows = Math.max(1, Math.ceil((minSilenceSec * 1000) / windowMs));
  const isSilent = envelope.map(v => v < threshold);

  const silenceRegions = [];
  let i = 0;
  while (i < isSilent.length) {
    if (isSilent[i]) {
      let j = i;
      while (j < isSilent.length && isSilent[j]) j++;
      if (j - i >= minSilenceWindows) silenceRegions.push([i, j]);
      i = j;
    } else i++;
  }

  const segments = [];
  let cursor = 0;
  for (const [s, e] of silenceRegions) {
    if (s > cursor) segments.push([cursor, s]);
    cursor = e;
  }
  if (cursor < envelope.length) segments.push([cursor, envelope.length]);

  const winSec = windowMs / 1000;
  return segments
    .map(([s, e]) => ({ startSec: s * winSec, endSec: Math.min(totalDurationSec, e * winSec) }))
    .filter(seg => (seg.endSec - seg.startSec) > 3); // ignora restos de menos de 3s (no son canciones)
}

function writeWavStr(view, offset, str) {
  for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
}

// ─── ETIQUETAS ID3v2 + CARÁTULA INCRUSTADAS EN EL WAV ──────────────────────────
function id3TextFrame(id, text) {
  const textBytes = new TextEncoder().encode(String(text || ''));
  const size = 1 + textBytes.length; // 1 byte de codificación + el texto
  const buf = new Uint8Array(10 + size);
  const view = new DataView(buf.buffer);
  writeWavStr(view, 0, id);
  view.setUint32(4, size, false); // tamaño normal (big-endian) en ID3v2.3, no synchsafe
  view.setUint16(8, 0, false); // flags
  buf[10] = 0; // codificación ISO-8859-1
  buf.set(textBytes, 11);
  return buf;
}

function id3TxxxFrame(description, text) {
  const descBytes = new TextEncoder().encode(description);
  const textBytes = new TextEncoder().encode(String(text || ''));
  const size = 1 + descBytes.length + 1 + textBytes.length; // enc + descripción + \0 + valor
  const buf = new Uint8Array(10 + size);
  const view = new DataView(buf.buffer);
  writeWavStr(view, 0, 'TXXX');
  view.setUint32(4, size, false);
  view.setUint16(8, 0, false);
  let off = 10;
  buf[off++] = 0; // codificación
  buf.set(descBytes, off); off += descBytes.length;
  buf[off++] = 0; // fin de la descripción
  buf.set(textBytes, off);
  return buf;
}

function id3ApicFrame(mime, pictureBytes) {
  const pic = pictureBytes instanceof Uint8Array ? pictureBytes : new Uint8Array(pictureBytes);
  const mimeBytes = new TextEncoder().encode(mime);
  const size = 1 + mimeBytes.length + 1 + 1 + 1 + pic.length; // enc+mime+\0+tipo+desc\0+datos
  const buf = new Uint8Array(10 + size);
  const view = new DataView(buf.buffer);
  writeWavStr(view, 0, 'APIC');
  view.setUint32(4, size, false);
  view.setUint16(8, 0, false);
  let off = 10;
  buf[off++] = 0; // codificación
  buf.set(mimeBytes, off); off += mimeBytes.length;
  buf[off++] = 0; // fin del mime type
  buf[off++] = 3; // tipo de imagen: portada frontal
  buf[off++] = 0; // descripción vacía + fin
  buf.set(pic, off);
  return buf;
}

function buildId3v2Tag(frames) {
  let totalSize = 0;
  for (const f of frames) totalSize += f.length;
  const header = new Uint8Array(10);
  writeWavStr(new DataView(header.buffer), 0, 'ID3');
  header[3] = 3; header[4] = 0; // versión 2.3.0
  header[5] = 0; // flags
  // tamaño en formato "synchsafe" (4 bytes, 7 bits útiles cada uno) — así es la cabecera ID3v2
  header[6] = (totalSize >> 21) & 0x7F;
  header[7] = (totalSize >> 14) & 0x7F;
  header[8] = (totalSize >> 7) & 0x7F;
  header[9] = totalSize & 0x7F;
  const out = new Uint8Array(10 + totalSize);
  out.set(header, 0);
  let off = 10;
  for (const f of frames) { out.set(f, off); off += f.length; }
  return out;
}

function wrapAsRiffChunk(chunkId, bytes) {
  const padded = bytes.length % 2 === 0 ? bytes : (() => { const p = new Uint8Array(bytes.length + 1); p.set(bytes); return p; })();
  const out = new Uint8Array(8 + padded.length);
  const view = new DataView(out.buffer);
  writeWavStr(view, 0, chunkId);
  view.setUint32(4, bytes.length, true); // tamaño real del chunk, sin el byte de relleno (RIFF es little-endian)
  out.set(padded, 8);
  return out;
}

// Añade un trozo (chunk) al final de un WAV ya construido, y corrige el tamaño total del RIFF
function appendRiffChunk(wavArrayBuffer, chunkBytes) {
  const wavBytes = new Uint8Array(wavArrayBuffer);
  const out = new Uint8Array(wavBytes.length + chunkBytes.length);
  out.set(wavBytes, 0);
  out.set(chunkBytes, wavBytes.length);
  new DataView(out.buffer).setUint32(4, out.length - 8, true); // offset 4 = tamaño RIFF total - 8
  return out.buffer;
}

// Cachea los bytes de la carátula (no solo la URL) para no volver a descargarla por cada tema del mismo disco
const coverBytesCache = {};
// Vía alternativa: dibuja la imagen ya cargada (como <img>, sin restricción de CORS
// para mostrarla) en un lienzo oculto, y saca los bytes de ahí. A veces esquiva el
// bloqueo de descarga directa; si el servidor bloquea de verdad, esto también falla.
function tryCoverViaCanvas(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || 500;
        canvas.height = img.naturalHeight || 500;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        canvas.toBlob((blob) => {
          if (!blob) { resolve(null); return; }
          blob.arrayBuffer().then(buf => resolve({ bytes: buf, mime: blob.type || 'image/jpeg' })).catch(() => resolve(null));
        }, 'image/jpeg', 0.92);
      } catch(e) {
        resolve(null); // lienzo contaminado: el bloqueo es real, no hay vuelta
      }
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

// Vía proxy: un servicio de terceros pide la imagen por nosotros (él no es un
// navegador, no tiene el problema de CORS) y nos la reenvía ya sin bloqueo.
// Probamos varios por si alguno está caído o da problemas.
async function tryCoverViaProxy(url) {
  const proxies = [
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
    'https://corsproxy.io/?' + encodeURIComponent(url),
  ];
  for (const proxyUrl of proxies) {
    try {
      const res = await fetch(proxyUrl);
      if (!res.ok) continue;
      const buf = await res.arrayBuffer();
      if (!buf || buf.byteLength < 200) continue; // demasiado pequeño para ser una imagen de verdad
      const mime = res.headers.get('content-type') || 'image/jpeg';
      return { bytes: buf, mime: mime.startsWith('image/') ? mime : 'image/jpeg', proxyUsed: proxyUrl };
    } catch(e) {
      continue; // este proxy ha fallado, probar el siguiente
    }
  }
  return null;
}

async function getCoverBytes(cleanId) {
  if (coverBytesCache[cleanId] !== undefined) return coverBytesCache[cleanId];
  const url = coverCache[cleanId];
  if (!url) {
    cortadorLogLine(`⚠ No hay carátula cargada para este disco (Discogs no la tiene, o falló al traerla) — se guarda sin carátula.`);
    coverBytesCache[cleanId] = null;
    return null;
  }
  // Intento 1: descarga directa
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const buf = await res.arrayBuffer();
    const mime = res.headers.get('content-type') || 'image/jpeg';
    const result = { bytes: buf, mime };
    coverBytesCache[cleanId] = result;
    return result;
  } catch(e) {
    console.error('Descarga directa de carátula falló, probando por proxy:', e);
  }

  // Intento 2: proxy de terceros
  const viaProxy = await tryCoverViaProxy(url);
  if (viaProxy) {
    coverBytesCache[cleanId] = viaProxy;
    cortadorLogLine(`✓ Carátula conseguida vía proxy (${viaProxy.proxyUsed.split('/')[2]}).`);
    return viaProxy;
  }

  // Intento 3: canvas (último recurso)
  const viaCanvas = await tryCoverViaCanvas(url);
  if (viaCanvas) {
    coverBytesCache[cleanId] = viaCanvas;
    cortadorLogLine(`✓ Carátula conseguida por la vía alternativa (canvas).`);
    return viaCanvas;
  }

  cortadorLogLine(`⚠ No se pudo conseguir la carátula por ninguna vía (directa, proxy, ni canvas) — el resto de etiquetas se guardan igual.`);
  coverBytesCache[cleanId] = null;
  return null;
}

// Construye el WAV final con etiquetas ID3v2 (título, artista, álbum, pista, año, género, sello) y carátula
async function embedTagsInWav(wavArrayBuffer, expTrack) {
  const row = expTrack.row;
  const frames = [];
  frames.push(id3TextFrame('TIT2', expTrack.title));
  if (row) {
    frames.push(id3TextFrame('TPE1', g(row, COL.artist)));
    frames.push(id3TextFrame('TALB', expTrack.disc));
    frames.push(id3TextFrame('TRCK', expTrack.position));
    if (g(row, COL.year)) frames.push(id3TextFrame('TYER', g(row, COL.year)));
    if (g(row, COL.genre)) frames.push(id3TextFrame('TCON', g(row, COL.genre)));
    if (g(row, COL.label)) frames.push(id3TextFrame('TPUB', g(row, COL.label)));
    if (g(row, COL.catalog)) frames.push(id3TxxxFrame('CATALOGNUMBER', g(row, COL.catalog)));
    if (g(row, COL.catalog)) frames.push(id3TextFrame('TCOM', g(row, COL.catalog))); // Compositor = referencia de catálogo, a petición

    const releaseId = g(row, COL.release_id);
    if (releaseId) {
      const cleanId = releaseId.toString().slice(0, -1);
      frames.push(id3TxxxFrame('DISCOGS_RELEASE_ID', cleanId)); // el mismo que usa Mp3tag, ya limpio para la API
      await loadCoverForRow(row); // asegura que coverCache tiene la URL de este disco
      const cover = await getCoverBytes(cleanId);
      if (cover) frames.push(id3ApicFrame(cover.mime, cover.bytes));
    }
  } else {
    frames.push(id3TextFrame('TALB', expTrack.disc));
    frames.push(id3TextFrame('TRCK', expTrack.position));
  }

  const id3Bytes = buildId3v2Tag(frames);
  const chunk = wrapAsRiffChunk('id3 ', id3Bytes);
  return appendRiffChunk(wavArrayBuffer, chunk);
}

// ─── ETIQUETAS EN FLAC (VORBIS_COMMENT + PICTURE) ──────────────────────────────
// FLAC no usa ID3 — usa sus propios "bloques" de metadatos. El de comentarios
// (VORBIS_COMMENT) va en little-endian, heredado tal cual del formato Ogg Vorbis;
// el resto de bloques, incluida la carátula (PICTURE), van en big-endian. Es una
// rareza real del formato, no un despiste.
function flacMetadataBlockHeader(type, bodyLength, isLast) {
  const buf = new Uint8Array(4);
  buf[0] = (isLast ? 0x80 : 0) | (type & 0x7F);
  buf[1] = (bodyLength >> 16) & 0xFF;
  buf[2] = (bodyLength >> 8) & 0xFF;
  buf[3] = bodyLength & 0xFF;
  return buf;
}

function buildFlacVorbisCommentBody(pairs) {
  const vendor = new TextEncoder().encode('VinylBase');
  const comments = pairs
    .filter(([, v]) => v != null && String(v) !== '')
    .map(([k, v]) => new TextEncoder().encode(`${k}=${v}`));
  let total = 4 + vendor.length + 4;
  for (const c of comments) total += 4 + c.length;
  const buf = new Uint8Array(total);
  const view = new DataView(buf.buffer);
  let off = 0;
  view.setUint32(off, vendor.length, true); off += 4; // little-endian (herencia de Ogg Vorbis)
  buf.set(vendor, off); off += vendor.length;
  view.setUint32(off, comments.length, true); off += 4;
  for (const c of comments) {
    view.setUint32(off, c.length, true); off += 4;
    buf.set(c, off); off += c.length;
  }
  return buf;
}

function buildFlacPictureBody(mime, pictureBytes) {
  const pic = pictureBytes instanceof Uint8Array ? pictureBytes : new Uint8Array(pictureBytes);
  const mimeBytes = new TextEncoder().encode(mime);
  const total = 4 + 4 + mimeBytes.length + 4 + 4 + 4 + 4 + 4 + 4 + pic.length;
  const buf = new Uint8Array(total);
  const view = new DataView(buf.buffer);
  let off = 0;
  view.setUint32(off, 3, false); off += 4; // tipo 3: portada frontal
  view.setUint32(off, mimeBytes.length, false); off += 4;
  buf.set(mimeBytes, off); off += mimeBytes.length;
  view.setUint32(off, 0, false); off += 4; // descripción vacía
  view.setUint32(off, 0, false); off += 4; // ancho desconocido
  view.setUint32(off, 0, false); off += 4; // alto desconocido
  view.setUint32(off, 0, false); off += 4; // profundidad de color desconocida
  view.setUint32(off, 0, false); off += 4; // no es imagen indexada
  view.setUint32(off, pic.length, false); off += 4;
  buf.set(pic, off);
  return buf;
}

// Recorre un FLAC ya existente, le quita cualquier VORBIS_COMMENT/PICTURE previos y le
// pone los nuevos con los mismos datos que usa el corte automático — el audio no se toca.
async function embedTagsInFlac(flacArrayBuffer, expTrack) {
  const bytes = new Uint8Array(flacArrayBuffer);
  if (new TextDecoder().decode(bytes.slice(0, 4)) !== 'fLaC') {
    throw new Error('No es un FLAC válido (falta la cabecera "fLaC")');
  }

  // Recorrer los bloques de metadatos existentes, conservando todos menos los de
  // comentarios y carátula (esos los vamos a sustituir por los nuestros).
  const keptBlocks = [];
  let pos = 4;
  let audioStart = null;
  while (pos + 4 <= bytes.length) {
    const flagByte = bytes[pos];
    const isLast = !!(flagByte & 0x80);
    const type = flagByte & 0x7F;
    const length = (bytes[pos + 1] << 16) | (bytes[pos + 2] << 8) | bytes[pos + 3];
    const bodyStart = pos + 4;
    const bodyEnd = bodyStart + length;
    if (type !== 4 && type !== 6) {
      keptBlocks.push({ type, body: bytes.slice(bodyStart, bodyEnd) });
    }
    pos = bodyEnd;
    if (isLast) { audioStart = pos; break; }
  }
  if (audioStart == null) throw new Error('FLAC sin bloque final de metadatos — archivo dañado o incompleto');

  const row = expTrack.row;
  const pairs = [
    ['TITLE', expTrack.title],
    ['TRACKNUMBER', expTrack.position],
    ['ALBUM', expTrack.disc],
  ];
  let coverBody = null;
  if (row) {
    pairs.push(['ARTIST', g(row, COL.artist)]);
    if (g(row, COL.year)) pairs.push(['DATE', g(row, COL.year)]);
    if (g(row, COL.genre)) pairs.push(['GENRE', g(row, COL.genre)]);
    if (g(row, COL.label)) pairs.push(['LABEL', g(row, COL.label)]);
    if (g(row, COL.catalog)) {
      pairs.push(['CATALOGNUMBER', g(row, COL.catalog)]);
      pairs.push(['COMPOSER', g(row, COL.catalog)]); // mismo criterio que en el WAV, a petición
    }
    const releaseId = g(row, COL.release_id);
    if (releaseId) {
      const cleanId = releaseId.toString().slice(0, -1);
      pairs.push(['DISCOGS_RELEASE_ID', cleanId]);
      await loadCoverForRow(row);
      const cover = await getCoverBytes(cleanId);
      if (cover) coverBody = buildFlacPictureBody(cover.mime, cover.bytes);
    }
  }

  keptBlocks.push({ type: 4, body: buildFlacVorbisCommentBody(pairs) });
  if (coverBody) keptBlocks.push({ type: 6, body: coverBody });

  let metaSize = 0;
  keptBlocks.forEach(b => metaSize += 4 + b.body.length);
  const out = new Uint8Array(4 + metaSize + (bytes.length - audioStart));
  out.set(new TextEncoder().encode('fLaC'), 0);
  let off = 4;
  keptBlocks.forEach((b, i) => {
    out.set(flacMetadataBlockHeader(b.type, b.body.length, i === keptBlocks.length - 1), off); off += 4;
    out.set(b.body, off); off += b.body.length;
  });
  out.set(bytes.slice(audioStart), off);
  return out.buffer;
}

// Segunda pasada de sentido común: un tema demasiado corto probablemente sea un pasaje
// flojo mal cortado (se fusiona con el vecino); un tema demasiado largo probablemente
// se haya "tragado" un hueco real (se vuelve a rastrear ahí dentro con más sensibilidad).
// Cuando sabemos el número exacto de temas y sus duraciones (Discogs), y detectamos
// MÁS trozos de los esperados, busca qué fusión de dos trozos vecinos hace que las
// duraciones resultantes se parezcan más a las reales — no solo "es corto, fusiona".
// Encuentra, de golpe, la mejor forma de convertir N trozos detectados en los M temas
// que dice Discogs — combinando fusiones (varios trozos seguidos = una canción mal
// cortada) y descartes (un trozo que no encaja en ningún lado = ruido/basura) — en vez
// de ir decidiendo de uno en uno, para no tomar una mala decisión a mitad de camino.
function reconcileSegmentCount(segments, expectedDurations, logFn) {
  const N = segments.length;
  const M = expectedDurations.length;
  if (N <= M) return segments.map(s => ({ ...s }));

  const INF = Infinity;
  // dp[i][j] = menor "distancia" total usando los primeros i trozos para cubrir los primeros j temas esperados
  const dp = Array.from({ length: N + 1 }, () => new Array(M + 1).fill(INF));
  const choice = Array.from({ length: N + 1 }, () => new Array(M + 1).fill(null));
  dp[0][0] = 0;

  for (let i = 1; i <= N; i++) {
    for (let j = 0; j <= M; j++) {
      // Opción 1: el trozo i (0-indexado i-1) es basura, se descarta, no cuenta para ningún tema
      if (dp[i - 1][j] < dp[i][j]) {
        dp[i][j] = dp[i - 1][j];
        choice[i][j] = { type: 'delete' };
      }
      // Opción 2: los trozos desde k hasta i-1 (0-indexados), fusionados si hace falta,
      // forman juntos el tema esperado número j-1
      if (j >= 1) {
        let sumDur = 0;
        for (let k = i - 1; k >= 0; k--) {
          sumDur += (segments[k].endSec - segments[k].startSec);
          const expDur = expectedDurations[j - 1];
          const durCost = expDur == null ? 0 : Math.abs(sumDur - expDur); // sin dato de Discogs, no penaliza
          const cost = dp[k][j - 1] + durCost;
          if (cost < dp[i][j]) {
            dp[i][j] = cost;
            choice[i][j] = { type: 'assign', from: k };
          }
        }
      }
    }
  }

  // Reconstruir la solución óptima hacia atrás
  const result = [];
  const deletedIdx = [];
  const mergedGroups = [];
  let i = N, j = M;
  while (i > 0) {
    const c = choice[i][j];
    if (!c) break; // no debería pasar, pero por seguridad
    if (c.type === 'delete') {
      deletedIdx.push(i - 1);
      i -= 1;
    } else {
      const k = c.from;
      const group = segments.slice(k, i);
      result.push({ startSec: group[0].startSec, endSec: group[group.length - 1].endSec });
      if (group.length > 1) mergedGroups.push(group.length);
      i = k;
      j -= 1;
    }
  }
  result.reverse();

  if (logFn) {
    if (deletedIdx.length) logFn(`Descartados ${deletedIdx.length} trozo(s) que no encajaban con ninguna duración de Discogs (ruido/basura).`);
    if (mergedGroups.length) logFn(`Fusionados ${mergedGroups.length} grupo(s) de trozos vecinos para encajar con las duraciones reales.`);
  }
  return result;
}

// Igual que reconcileSegmentCount, pero en vez de devolver los trozos ya fusionados,
// devuelve para CADA trozo en bruto a qué tema esperado (índice) está asignado, o -1 si
// se sugiere descartarlo — para poder mostrarlo editable en el modo de revisión manual.
function computeDefaultAssignments(segments, expectedDurations) {
  const N = segments.length, M = expectedDurations.length;
  if (N === 0) return [];
  if (M === 0) return segments.map(() => -1);
  if (N <= M) return segments.map((s, i) => i); // uno a uno, en orden, sin descartes

  const INF = Infinity;
  const dp = Array.from({ length: N + 1 }, () => new Array(M + 1).fill(INF));
  const choice = Array.from({ length: N + 1 }, () => new Array(M + 1).fill(null));
  dp[0][0] = 0;
  for (let i = 1; i <= N; i++) {
    for (let j = 0; j <= M; j++) {
      if (dp[i - 1][j] < dp[i][j]) { dp[i][j] = dp[i - 1][j]; choice[i][j] = { type: 'delete' }; }
      if (j >= 1) {
        let sumDur = 0;
        for (let k = i - 1; k >= 0; k--) {
          sumDur += (segments[k].endSec - segments[k].startSec);
          const expDur = expectedDurations[j - 1];
          const durCost = expDur == null ? 0 : Math.abs(sumDur - expDur);
          const cost = dp[k][j - 1] + durCost;
          if (cost < dp[i][j]) { dp[i][j] = cost; choice[i][j] = { type: 'assign', from: k }; }
        }
      }
    }
  }
  const assignments = new Array(N).fill(-1);
  let i = N, j = M;
  while (i > 0) {
    const c = choice[i][j];
    if (!c) break;
    if (c.type === 'delete') { i -= 1; }
    else {
      const k = c.from;
      for (let idx = k; idx < i; idx++) assignments[idx] = j - 1;
      i = k; j -= 1;
    }
  }
  return assignments;
}

function refineSegmentsByDuration(segments, envelope, windowMs, minTrackSec, maxTrackSec, skipShortHandling) {
  const merged = skipShortHandling ? segments.map(s => ({ ...s })) : mergeShortSegments(segments, minTrackSec);

  const notes = [];
  const result = [];
  for (const seg of merged) {
    result.push(...rescueLongSegment(seg, envelope, windowMs, minTrackSec, maxTrackSec, notes));
  }
  return { segments: result, notes };
}

// Fusiona los trozos demasiado cortos con el vecino MÁS CORTO de los dos (el anterior o
// el siguiente) — normalmente es la otra mitad de la misma canción mal cortada, no el
// tema de al lado (que suele durar más). Si solo hay un vecino posible, se usa ese.
// trashThresholdSec === 0 desactiva el descarte automático por tamaño (se usa cuando hay
// duraciones de Discogs disponibles, para no tirar acapellas cortas reales).
function mergeShortSegments(segments, minTrackSec, trashThresholdSec) {
  // Por debajo de este tamaño, ya no es "una canción mal cortada" — es basura real
  // (ruido de aguja, cambio de disco). Se descarta sin más, no se pega a ningún vecino.
  const TRASH_THRESHOLD_SEC = trashThresholdSec != null ? trashThresholdSec : Math.min(30, minTrackSec * 0.3);

  let segs = segments.map(s => ({ ...s }));
  let iterations = 0;
  while (iterations < 500) {
    iterations++;
    let idx = -1;
    for (let i = 0; i < segs.length; i++) {
      if ((segs[i].endSec - segs[i].startSec) < minTrackSec) { idx = i; break; }
    }
    if (idx === -1) break; // no quedan trozos demasiado cortos
    if (segs.length === 1) break; // no hay nada con quien fusionar

    const dur = segs[idx].endSec - segs[idx].startSec;
    if (TRASH_THRESHOLD_SEC > 0 && dur < TRASH_THRESHOLD_SEC) {
      segs.splice(idx, 1); // basura: fuera, no se pega a ningún tema
      continue;
    }

    const prev = idx > 0 ? segs[idx - 1] : null;
    const next = idx < segs.length - 1 ? segs[idx + 1] : null;
    let mergeWithNext;
    if (!prev) mergeWithNext = true;
    else if (!next) mergeWithNext = false;
    else mergeWithNext = (next.endSec - next.startSec) <= (prev.endSec - prev.startSec);

    if (mergeWithNext) {
      segs[idx] = { startSec: segs[idx].startSec, endSec: next.endSec };
      segs.splice(idx + 1, 1);
    } else {
      segs[idx - 1] = { startSec: prev.startSec, endSec: segs[idx].endSec };
      segs.splice(idx, 1);
    }
  }
  return segs;
}

// Dentro de un tramo, busca el punto con menor amplitud media sostenida (ventana de ~1s),
// evitando los bordes -- es el mejor candidato de corte cuando no hay un silencio "limpio".
function findQuietestPoint(subEnv, windowMs, minTrackSec) {
  const winSec = windowMs / 1000;
  const spanWindows = Math.max(1, Math.round(1.0 / winSec));
  const marginWindows = Math.max(1, Math.round((minTrackSec * 0.3) / winSec));
  if (subEnv.length - spanWindows - marginWindows * 2 <= 0) return null;
  let bestIdx = -1, bestVal = Infinity;
  for (let i = marginWindows; i < subEnv.length - spanWindows - marginWindows; i++) {
    let sum = 0;
    for (let k = 0; k < spanWindows; k++) sum += subEnv[i + k];
    const avg = sum / spanWindows;
    if (avg < bestVal) { bestVal = avg; bestIdx = i; }
  }
  if (bestIdx === -1) return null;
  return (bestIdx + spanWindows / 2) * winSec;
}

// Intenta rescatar un tramo demasiado largo: primero probando huecos cada vez más flojos
// y más cortos; si no encuentra ninguno limpio, fuerza el corte en el punto más silencioso
// que haya. Se llama a sí misma por si el trozo resultante sigue siendo demasiado largo.
function rescueLongSegment(seg, envelope, windowMs, minTrackSec, maxTrackSec, notes) {
  const durationSec = seg.endSec - seg.startSec;
  if (durationSec <= maxTrackSec) return [seg];

  const winSec = windowMs / 1000;
  const wStart = Math.max(0, Math.floor(seg.startSec / winSec));
  const wEnd = Math.min(envelope.length, Math.ceil(seg.endSec / winSec));
  const subEnv = envelope.slice(wStart, wEnd);

  let rescued = null;
  outer:
  for (const marginDb of [6, 9, 12, 16, 20, 25]) {
    for (const minSil of [0.6, 0.3]) {
      const dbTry = computeAdaptiveThresholdDb(subEnv, marginDb);
      const subSegs = detectSegments(subEnv, windowMs, dbTry, minSil, durationSec);
      if (subSegs.length > 1) { rescued = subSegs; break outer; }
    }
  }

  let pieces;
  if (rescued) {
    pieces = rescued.map(s => ({ startSec: seg.startSec + s.startSec, endSec: seg.startSec + s.endSec }));
    notes.push(`↳ Tema largo (${fmtDuration(durationSec)}) — encontrado un hueco que faltaba, dividido en ${rescued.length}`);
  } else {
    const splitSec = findQuietestPoint(subEnv, windowMs, minTrackSec);
    if (splitSec == null) {
      notes.push(`⚠ Tema de ${fmtDuration(durationSec)} — no pude dividirlo, revísalo tú`);
      return [seg];
    }
    pieces = [
      { startSec: seg.startSec, endSec: seg.startSec + splitSec },
      { startSec: seg.startSec + splitSec, endSec: seg.endSec },
    ];
    notes.push(`⚠ Tema largo (${fmtDuration(durationSec)}) — no encontré un hueco limpio, corté en el punto más flojo (${fmtDuration(seg.startSec + splitSec)}). Revísalo, puede no ser exacto.`);
  }

  // Por si alguno de los trozos resultantes sigue siendo demasiado largo
  let final = [];
  for (const p of pieces) final = final.concat(rescueLongSegment(p, envelope, windowMs, minTrackSec, maxTrackSec, notes));
  return final;
}

function extractWavSegment(buffer, fmt, dataOffset, dataLength, startSec, endSec) {
  const { sampleRate, numChannels, bitsPerSample } = fmt;
  const frameSize = (bitsPerSample / 8) * numChannels;
  const totalFrames = Math.floor(dataLength / frameSize);
  let startFrame = Math.max(0, Math.floor(startSec * sampleRate));
  let endFrame = Math.min(totalFrames, Math.ceil(endSec * sampleRate));
  if (endFrame <= startFrame) endFrame = Math.min(totalFrames, startFrame + 1);
  const dataBytes = (endFrame - startFrame) * frameSize;

  const headerSize = 44;
  const out = new ArrayBuffer(headerSize + dataBytes);
  const view = new DataView(out);
  const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
  writeWavStr(view, 0, 'RIFF');
  view.setUint32(4, 36 + dataBytes, true);
  writeWavStr(view, 8, 'WAVE');
  writeWavStr(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, frameSize, true);
  view.setUint16(34, bitsPerSample, true);
  writeWavStr(view, 36, 'data');
  view.setUint32(40, dataBytes, true);
  new Uint8Array(out, headerSize).set(new Uint8Array(buffer, dataOffset + startFrame * frameSize, dataBytes));
  return out;
}

function fmtDuration(sec) {
  const totalSec = Math.max(0, Math.round(sec));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return m + ':' + String(s).padStart(2, '0');
}

// Barra horizontal con la duración total del WAV grabado, marcando en verde los trozos
// que se han conservado y en rojo los que se han descartado — para cruzarla con Audition
// y ver de un vistazo dónde puede estar el fallo, si lo hay.
function buildTimelineHtml(totalDurationSec, segs) {
  if (!totalDurationSec || !segs || !segs.length) return '';
  const totalMin = totalDurationSec / 60;
  const step = totalMin > 40 ? 10 : totalMin > 15 ? 5 : totalMin > 6 ? 2 : 1;
  let marks = '';
  for (let m = 0; m <= totalMin + 0.001; m += step) {
    const pct = Math.min(100, (m * 60 / totalDurationSec * 100)).toFixed(3);
    marks += `<div style="position:absolute;left:${pct}%;top:0;height:32px;border-left:1px dashed var(--border);pointer-events:none"></div>`;
    marks += `<div style="position:absolute;left:${pct}%;top:34px;font-size:9px;color:var(--text3);transform:translateX(-2px)">${Math.round(m)}'</div>`;
  }
  const bars = segs.map(s => {
    const left = (s.startSec / totalDurationSec * 100).toFixed(3);
    const width = Math.max(0.15, (s.endSec - s.startSec) / totalDurationSec * 100).toFixed(3);
    const color = s.kept ? 'var(--accent)' : 'rgba(220,80,80,.65)';
    const title = `${fmtDuration(s.startSec)} → ${fmtDuration(s.endSec)}${s.label ? ' — ' + s.label : ''}${s.kept ? '' : ' (descartado)'}`;
    return `<div title="${title}" style="position:absolute;left:${left}%;width:${width}%;top:2px;bottom:2px;background:${color};border-radius:2px"></div>`;
  }).join('');
  return `<div style="margin-top:14px">
    <div style="display:flex;gap:14px;font-size:10px;color:var(--text3);margin-bottom:6px">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;vertical-align:middle;margin-right:4px"></span>Conservado</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:rgba(220,80,80,.65);border-radius:2px;vertical-align:middle;margin-right:4px"></span>Descartado</span>
    </div>
    <div style="position:relative;height:48px">
      <div style="position:absolute;left:0;right:0;top:0;height:32px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;overflow:hidden">${bars}</div>
      ${marks}
    </div>
  </div>`;
}

// Analiza el WAV y devuelve los segmentos ya calculados con los márgenes aplicados,
// SIN escribir ningún archivo. La usan tanto la vista previa como el guardado real.
async function analyzeCortadorRaw() {
  readCortadorFormIntoSettings();
  const isAuto = cortadorSettings.auto;
  const minSilenceSec = cortadorSettings.minSilenceSec;
  const manualThresholdDb = cortadorSettings.thresholdDb;
  const minTrackMin = cortadorSettings.minTrackMin;
  const maxTrackMin = cortadorSettings.maxTrackMin;
  const trimStartSec = cortadorSettings.trimStartSec;
  const padEndSec = cortadorSettings.padEndSec;

  cortadorLogLine('Leyendo el archivo...');
  const file = await cortadorFileHandle.getFile();
  const buffer = await file.arrayBuffer();

  cortadorLogLine('Analizando el WAV...');
  const { fmt, dataOffset, dataLength } = parseWavHeader(buffer);
  const frameSize = (fmt.bitsPerSample / 8) * fmt.numChannels;
  const totalDurationSec = dataLength / frameSize / fmt.sampleRate;

  cortadorLogLine('Detectando silencios entre temas...');
  const { envelope, windowMs } = computeEnvelope(buffer, fmt, dataOffset, dataLength, 50);
  const thresholdDb = isAuto ? computeAdaptiveThresholdDb(envelope, 4) : manualThresholdDb;
  cortadorLogLine(isAuto ? `Umbral automático calculado: ${thresholdDb.toFixed(1)} dB` : `Umbral manual: ${thresholdDb} dB`);
  let segments = detectSegments(envelope, windowMs, thresholdDb, minSilenceSec, totalDurationSec);
  const rawDetectedSegments = segments.map(s => ({ ...s })); // copia tal cual detectado, antes de fusiones/descartes — para la línea de tiempo

  if (!segments.length) {
    cortadorLogLine('⚠ No se detectó ningún tema. Prueba a bajar el umbral de silencio.');
    return null;
  }

  cortadorLogLine(`🔍 En bruto (antes de fusiones/rescates): ${segments.length} trozos:`);
  segments.forEach((s, i) => cortadorLogLine(`   ${i+1}. ${fmtDuration(s.startSec)} a ${fmtDuration(s.endSec)} (${fmtDuration(s.endSec - s.startSec)})`));

  // Si conocemos duraciones reales de Discogs, ensanchar el rango min/max para que
  // no fusione ni rescate temas que ya sabemos que son legítimamente cortos o largos.
  const expectedTracksPre = getCortadorExpectedTracks();
  const knownDurations = expectedTracksPre.map(t => t.durationSec).filter(d => d != null);
  let effectiveMinSec = minTrackMin * 60;
  let effectiveMaxSec = maxTrackMin * 60;
  if (knownDurations.length) {
    const minExpected = Math.min(...knownDurations) * 0.85; // un poco de margen
    const maxExpected = Math.max(...knownDurations) * 1.15;
    if (minExpected < effectiveMinSec) {
      cortadorLogLine(`Discogs dice que hay temas de hasta ${fmtDuration(Math.min(...knownDurations))} — bajando el mínimo para no fusionarlos.`);
      effectiveMinSec = minExpected;
    }
    if (maxExpected > effectiveMaxSec) {
      cortadorLogLine(`Discogs dice que hay temas de hasta ${fmtDuration(Math.max(...knownDurations))} — subiendo el máximo para no partirlos de más.`);
      effectiveMaxSec = maxExpected;
    }
  }

  // Si tenemos duraciones reales de Discogs, saltamos la fusión/descarte ciego por
  // tamaño del todo — es la comparación con Discogs (más abajo) la que decide qué es
  // basura y qué es una canción corta de verdad (acapellas, etc.), no un tamaño fijo.
  const skipShortHandling = expectedTracksPre.length > 0;
  const refined = refineSegmentsByDuration(segments, envelope, windowMs, effectiveMinSec, effectiveMaxSec, skipShortHandling);
  segments = refined.segments;
  if (refined.notes.length) {
    cortadorLogLine(`Ajustando por duración esperada (${(effectiveMinSec/60).toFixed(1)}-${(effectiveMaxSec/60).toFixed(1)} min)...`);
    refined.notes.forEach(cortadorLogLine);
  }

  // Si detectamos MENOS trozos de los que dice Discogs, es que se nos ha escapado
  // algún hueco real — reintentar la detección con más sensibilidad antes de rendirnos.
  if (expectedTracksPre.length && segments.length < expectedTracksPre.length) {
    cortadorLogLine(`Se detectaron ${segments.length} trozos pero Discogs dice que hay ${expectedTracksPre.length} temas — reintentando con más sensibilidad...`);
    for (const marginDb of [6, 9, 12, 16]) {
      const dbTry = computeAdaptiveThresholdDb(envelope, marginDb);
      const retry = detectSegments(envelope, windowMs, dbTry, Math.max(0.4, minSilenceSec * 0.4), totalDurationSec);
      if (retry.length > segments.length) {
        segments = retry;
        cortadorLogLine(`   Con más sensibilidad (${dbTry.toFixed(1)}dB) aparecen ${retry.length} trozos.`);
        if (segments.length >= expectedTracksPre.length) break;
      }
    }
    if (segments.length < expectedTracksPre.length) {
      cortadorLogLine(`⚠ Aun así siguen faltando temas — puede que algún hueco real sea demasiado débil para detectarlo. Revísalo a mano.`);
    }
  }

  return { buffer, fmt, dataOffset, dataLength, totalDurationSec, segments, rawDetectedSegments, expectedTracksPre, trimStartSec, padEndSec };
}

function buildFinalSegments(segments, totalDurationSec, trimStartSec, padEndSec) {
  return segments.map((seg, i) => {
    const earliestAllowed = i > 0 ? segments[i - 1].endSec + padEndSec : 0;
    const startTrimmed = Math.max(earliestAllowed, seg.startSec - trimStartSec);
    const endWithPad = Math.min(totalDurationSec, seg.endSec + padEndSec);
    return { detectedAt: seg.startSec, startTrimmed, endWithPad };
  });
}

// Nombre de archivo "(Artista) - Título" a partir de un tema esperado de Discogs.
// Si no hay artista disponible, cae en la posición (A1, A2...) o un número.
function buildTrackFileName(expTrack, fallbackIndex) {
  const artist = expTrack.row ? g(expTrack.row, COL.artist) : '';
  const title = expTrack.title || '';
  if (artist && title) return sanitizeFolderName(`${artist} - ${title}`);
  if (title) return sanitizeFolderName(title);
  const pos = (expTrack.position || '').trim();
  if (pos) return sanitizeFolderName(pos);
  return String(fallbackIndex + 1);
}

async function analyzeCortador() {
  const raw = await analyzeCortadorRaw();
  if (!raw) return null;
  let { buffer, fmt, dataOffset, dataLength, totalDurationSec, segments, rawDetectedSegments, expectedTracksPre, trimStartSec, padEndSec } = raw;

  // Si el número de trozos detectados no coincide con el número real de temas de
  // Discogs, reconciliarlo (fusionando y/o descartando) para encajar con las duraciones reales.
  if (expectedTracksPre.length && segments.length !== expectedTracksPre.length) {
    const expectedDurations = expectedTracksPre.map(t => t.durationSec); // puede tener null
    cortadorLogLine(`Ajustando ${segments.length} trozos a los ${expectedDurations.length} temas de Discogs...`);
    segments = reconcileSegmentCount(segments, expectedDurations, cortadorLogLine);
  }

  // Aplicar los márgenes de inicio/final a cada segmento, calculando ya el resultado final
  const finalSegments = buildFinalSegments(segments, totalDurationSec, trimStartSec, padEndSec);

  // Si hay discos de la sesión añadidos, comparar contra lo que dice Discogs
  const expectedTracks = getCortadorExpectedTracks();
  if (expectedTracks.length) {
    const expectedTotalSec = expectedTracks.reduce((a, t) => a + (t.durationSec || 0), 0);
    const detectedTotalSec = finalSegments.reduce((a, s) => a + (s.endWithPad - s.startTrimmed), 0);
    cortadorLogLine('');
    cortadorLogLine(`📀 Discogs esperaba: ${expectedTracks.length} temas, ${fmtDuration(expectedTotalSec)} en total (de los que tienen duración en Discogs).`);
    cortadorLogLine(`   Se han detectado: ${finalSegments.length} temas, ${fmtDuration(detectedTotalSec)} en total.`);
    if (finalSegments.length !== expectedTracks.length) {
      cortadorLogLine(`⚠ El número de temas no coincide — puede que sobre o falte algún corte.`);
    } else {
      cortadorLogLine('Comparación tema a tema:');
      finalSegments.forEach((s, i) => {
        const exp = expectedTracks[i];
        const detDur = s.endWithPad - s.startTrimmed;
        if (exp.durationSec == null) {
          cortadorLogLine(`  ${i+1}. "${exp.title}" — Discogs no tiene la duración, detectado ${fmtDuration(detDur)}`);
        } else {
          const diff = detDur - exp.durationSec;
          const diffPct = Math.abs(diff) / exp.durationSec;
          const flag = diffPct > 0.25 ? ' ⚠ revisar' : '';
          cortadorLogLine(`  ${i+1}. "${exp.title}" — esperado ${fmtDuration(exp.durationSec)}, detectado ${fmtDuration(detDur)}${flag}`);
        }
      });
    }
    cortadorLogLine('');
  }

  // Solo nos fiamos de "qué tema es cuál" para etiquetar si el número coincide exacto
  const matchedExpectedTracks = (expectedTracks.length && finalSegments.length === expectedTracks.length)
    ? expectedTracks
    : null;

  // Línea de tiempo: cada trozo tal cual se detectó al principio (antes de fusiones/descartes),
  // marcado como conservado si cae dentro de alguno de los temas finales, o descartado si no.
  const timelineSegs = rawDetectedSegments.map(rs => {
    const fi = finalSegments.findIndex(fs => rs.startSec < fs.endWithPad && rs.endSec > fs.startTrimmed);
    const kept = fi !== -1;
    const label = kept && matchedExpectedTracks && matchedExpectedTracks[fi] ? matchedExpectedTracks[fi].title : '';
    return { startSec: rs.startSec, endSec: rs.endSec, kept, label };
  });

  return { buffer, fmt, dataOffset, dataLength, finalSegments, matchedExpectedTracks, totalDurationSec, timelineSegs };
}

async function previewCortador() {
  if (!cortadorFileHandle || cortadorRunning) return;
  const wantManual = !!document.getElementById('cortador-manualassoc')?.checked;
  if (wantManual) { await startCortadorAssociation(); return; }
  cortadorRunning = true;
  cortadorLog = [];
  cortadorTimelineData = null;
  renderCortador();
  try {
    const result = await analyzeCortador();
    if (result) {
      cortadorLogLine(`👁 Vista previa — ${result.finalSegments.length} temas (nada se ha guardado):`);
      result.finalSegments.forEach((s, i) => {
        cortadorLogLine(`  ${i + 1}. detectado en ${s.detectedAt.toFixed(2)}s → ${fmtDuration(s.startTrimmed)} a ${fmtDuration(s.endWithPad)} (${fmtDuration(s.endWithPad - s.startTrimmed)})`);
      });
      cortadorLogLine('Si te vale, pulsa "Cortar y guardar". Si no, ajusta los parámetros y vuelve a previsualizar.');
      cortadorTimelineData = { totalDurationSec: result.totalDurationSec, segs: result.timelineSegs };
    }
  } catch(e) {
    console.error(e);
    cortadorLogLine('⚠ Error: ' + e.message);
  }
  cortadorRunning = false;
  renderCortador();
}

async function startCortadorAssociation() {
  if (!cortadorFileHandle || cortadorRunning) return;
  cortadorRunning = true;
  cortadorLog = [];
  renderCortador();
  try {
    const raw = await analyzeCortadorRaw();
    if (!raw) { cortadorRunning = false; renderCortador(); return; }
    const expectedDurations = raw.expectedTracksPre.map(t => t.durationSec);
    const assignments = computeDefaultAssignments(raw.segments, expectedDurations);
    cortadorAssocData = { ...raw, assignments };
    cortadorAssocActive = true;
    cortadorLogLine('Sugerencia de asociación calculada. Revísala abajo y corrige lo que haga falta antes de guardar.');
  } catch(e) {
    console.error(e);
    cortadorLogLine('⚠ Error: ' + e.message);
  }
  cortadorRunning = false;
  renderCortador();
}

function setCortadorAssignment(idx, value) {
  if (!cortadorAssocData) return;
  cortadorAssocData.assignments[idx] = parseInt(value, 10);
  renderCortador();
}

function cancelCortadorAssociation() {
  cortadorAssocActive = false;
  cortadorAssocData = null;
  renderCortador();
}

async function confirmCortadorAssociation() {
  if (!cortadorAssocData || !cortadorOutDirHandle || cortadorRunning) return;
  cortadorRunning = true;
  renderCortador();
  try {
    const { buffer, fmt, dataOffset, dataLength, totalDurationSec, segments, expectedTracksPre, trimStartSec, padEndSec, assignments } = cortadorAssocData;

    // Agrupar los trozos en bruto según lo que el usuario ha asociado a mano
    const groups = {};
    segments.forEach((seg, i) => {
      const a = assignments[i];
      if (a == null || a < 0) return; // descartado
      if (!groups[a]) groups[a] = [];
      groups[a].push(seg);
    });

    const orderedExpIdx = Object.keys(groups).map(Number).sort((a, b) => a - b);
    if (!orderedExpIdx.length) {
      cortadorLogLine('⚠ No has asociado ningún trozo a ningún tema — no hay nada que guardar.');
      cortadorRunning = false;
      renderCortador();
      return;
    }
    const mergedSegments = orderedExpIdx.map(expIdx => {
      const group = groups[expIdx].slice().sort((a, b) => a.startSec - b.startSec);
      return { startSec: group[0].startSec, endSec: group[group.length - 1].endSec };
    });
    const matchedTracksInOrder = orderedExpIdx.map(expIdx => expectedTracksPre[expIdx]);

    if (orderedExpIdx.length < expectedTracksPre.length) {
      cortadorLogLine(`⚠ Quedan ${expectedTracksPre.length - orderedExpIdx.length} tema(s) de Discogs sin ningún trozo asignado — no se guardarán esos.`);
    }

    const finalSegments = buildFinalSegments(mergedSegments, totalDurationSec, trimStartSec, padEndSec);

    cortadorLogLine(`Guardando ${finalSegments.length} temas según tu asociación...`);
    const usedNames = new Set();
    for (let i = 0; i < finalSegments.length; i++) {
      const s = finalSegments[i];
      let wavBuffer = extractWavSegment(buffer, fmt, dataOffset, dataLength, s.startTrimmed, s.endWithPad);
      let baseName = String(i + 1);
      try {
        wavBuffer = await embedTagsInWav(wavBuffer, matchedTracksInOrder[i]);
      } catch(e) { console.error('Error incrustando etiquetas:', e); }
      const pos = buildTrackFileName(matchedTracksInOrder[i], i);
      if (pos) baseName = pos;
      if (usedNames.has(baseName)) baseName = baseName + '_' + (i + 1);
      usedNames.add(baseName);
      const outHandle = await cortadorOutDirHandle.getFileHandle(baseName + '.wav', { create: true });
      const writable = await outHandle.createWritable();
      await writable.write(wavBuffer);
      await writable.close();
      cortadorLogLine(`✓ ${baseName}.wav — ${fmtDuration(s.startTrimmed)} → ${fmtDuration(s.endWithPad)} (${fmtDuration(s.endWithPad - s.startTrimmed)})`);
    }
    cortadorLogLine(`✓ Listo. ${finalSegments.length} archivos guardados en "${cortadorOutDirHandle.name}".`);
    showToast(`✓ ${finalSegments.length} temas cortados y guardados`);
    cortadorAssocActive = false;
    cortadorAssocData = null;
  } catch(e) {
    console.error(e);
    cortadorLogLine('⚠ Error: ' + e.message);
    showToast('⚠ Error al procesar el WAV', true);
  }
  cortadorRunning = false;
  renderCortador();
}

async function runCortador() {
  if (!cortadorFileHandle || !cortadorOutDirHandle || cortadorRunning) return;
  const wantManual = !!document.getElementById('cortador-manualassoc')?.checked;
  if (wantManual) { await startCortadorAssociation(); return; }
  cortadorRunning = true;
  cortadorLog = [];
  cortadorTimelineData = null;
  renderCortador();
  try {
    const result = await analyzeCortador();
    if (!result) { cortadorRunning = false; renderCortador(); return; }
    const { buffer, fmt, dataOffset, dataLength, finalSegments, matchedExpectedTracks } = result;
    cortadorTimelineData = { totalDurationSec: result.totalDurationSec, segs: result.timelineSegs };

    if (matchedExpectedTracks) {
      cortadorLogLine('🏷 Se incrustarán título, artista, álbum, pista, año, género, sello, referencia de catálogo (en catálogo y compositor) y carátula (coincide el número de temas con Discogs).');
    }

    cortadorLogLine(`Detectados ${finalSegments.length} temas. Guardando...`);
    const usedNames = new Set();
    for (let i = 0; i < finalSegments.length; i++) {
      const s = finalSegments[i];
      let wavBuffer = extractWavSegment(buffer, fmt, dataOffset, dataLength, s.startTrimmed, s.endWithPad);
      let baseName = String(i + 1);
      if (matchedExpectedTracks) {
        try {
          wavBuffer = await embedTagsInWav(wavBuffer, matchedExpectedTracks[i]);
        } catch(e) {
          console.error('Error incrustando etiquetas:', e);
        }
        const pos = buildTrackFileName(matchedExpectedTracks[i], i);
        if (pos) baseName = pos;
      }
      if (usedNames.has(baseName)) baseName = baseName + '_' + (i + 1); // por si dos posiciones salen iguales
      usedNames.add(baseName);
      const outHandle = await cortadorOutDirHandle.getFileHandle(baseName + '.wav', { create: true });
      const writable = await outHandle.createWritable();
      await writable.write(wavBuffer);
      await writable.close();
      cortadorLogLine(`✓ ${baseName}.wav — detectado en ${s.detectedAt.toFixed(2)}s, recortado a ${fmtDuration(s.startTrimmed)} → ${fmtDuration(s.endWithPad)} (${fmtDuration(s.endWithPad - s.startTrimmed)})`);
    }
    cortadorLogLine(`✓ Listo. ${finalSegments.length} archivos guardados en "${cortadorOutDirHandle.name}".`);
    showToast(`✓ ${finalSegments.length} temas cortados y guardados`);
  } catch(e) {
    console.error(e);
    cortadorLogLine('⚠ Error: ' + e.message);
    showToast('⚠ Error al procesar el WAV', true);
  }
  cortadorRunning = false;
  renderCortador();
}

function sanitizeFolderName(name) {
  return name
    .replace(/[\/:*?"<>|]/g, '-')  // caracteres prohibidos en Windows
    .replace(/\.+$/g, '')           // quitar puntos al final
    .replace(/\s+/g, ' ')           // espacios múltiples
    .trim();
}

async function createFolderForRow(idx) {
  if (!window.showDirectoryPicker) {
    showToast('⚠ Tu navegador no soporta esta función (usa Chrome/Brave/Edge)', true);
    return;
  }
  const row = allData[idx];
  const catalog = g(row, COL.catalog);
  const artist = g(row, COL.artist);
  const title = g(row, COL.title);
  const folderName = sanitizeFolderName(`(${catalog}) ${artist} - ${title}`);

  const root = await getRootDir();
  if (!root) return;

  try {
    await root.getDirectoryHandle(folderName, { create: true });
    showToast('✓ Carpeta creada: ' + folderName);
  } catch(e) {
    console.error(e);
    showToast('⚠ Error al crear carpeta', true);
  }
}

// ─── REPRODUCIR TEMAS (localizar archivo y sonar en la app) ────────────────────
function normName(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
}

function readTags(file) {
  return new Promise((resolve) => {
    try {
      if (!window.jsmediatags) { resolve({}); return; }
      new window.jsmediatags.Reader(file).setTagsToRead(['title', 'artist', 'album', 'genre', 'track']).read({
        onSuccess: (tag) => resolve((tag && tag.tags) || {}),
        onError: () => resolve({}),
      });
    } catch(e) { resolve({}); }
  });
}

async function ensureMusicIndex() {
  if (musicIndex) return musicIndex;
  const dir = await getMusicDir();
  if (!dir) return null;
  const dir2 = await getMusicDir2(); // opcional, null si no se ha elegido

  showToast('Indexando tu música (leyendo etiquetas)... puede tardar un poco');
  const files = [];
  async function walk(d, prefix, source) {
    for await (const [name, handle] of d.entries()) {
      const relPath = prefix ? prefix + '/' + name : name;
      if (handle.kind === 'file' && /\.(mp3|wav|flac|m4a|aac|ogg)$/i.test(name)) {
        files.push({ handle, relPath, source });
      } else if (handle.kind === 'directory') {
        await walk(handle, relPath, source);
      }
    }
  }
  try {
    await walk(dir, dir.name, 'ripeados');
    if (dir2) await walk(dir2, dir2.name, 'juntos');
  } catch(e) {
    showToast('⚠ Error leyendo la carpeta de música', true);
    return null;
  }

  const index = [];
  let done = 0;
  for (const item of files) {
    try {
      const file = await item.handle.getFile();
      const tags = await readTags(file);
      const complete = !!(tags.title && tags.artist && tags.album && tags.genre && tags.track);
      index.push({
        title: tags.title || '', artist: tags.artist || '', album: tags.album || '',
        handle: item.handle, relPath: item.relPath, complete, source: item.source,
      });
    } catch(e) { /* archivo ilegible, se ignora */ }
    done++;
    if (done % 150 === 0) showToast(`Indexando... ${done}/${files.length}`);
  }
  musicIndex = index;
  showToast(`✓ Música indexada: ${index.length} temas`);
  return musicIndex;
}

// ─── ORIGEN DE LOS ARCHIVOS: propio (ripeado por ti) vs tienda ─────────────────
const ORIGIN_KEY = 'vinylbase_origin_overrides';
let originOverrides = {};
try { originOverrides = JSON.parse(localStorage.getItem(ORIGIN_KEY) || '{}'); } catch(e) { originOverrides = {}; }

function saveOriginOverrides() {
  try { localStorage.setItem(ORIGIN_KEY, JSON.stringify(originOverrides)); } catch(e) { /* ignorar si no hay storage */ }
}

function trackOrigin(relPath, complete, source) {
  if (originOverrides[relPath]) return originOverrides[relPath]; // 'propio' | 'tienda'
  if (source === 'ripeados') return 'propio'; // en la carpeta de Ripeados, siempre es tuyo, sin dudas
  return complete ? 'propio' : 'tienda';
}

function toggleOrigin(relPath, complete, source) {
  const current = trackOrigin(relPath, complete, source);
  originOverrides[relPath] = current === 'propio' ? 'tienda' : 'propio';
  saveOriginOverrides();
  renderView();
}

function toggleTrackExpand(key) {
  if (expandedDuplicates.has(key)) expandedDuplicates.delete(key);
  else expandedDuplicates.add(key);
  renderView();
}

// Busca en el índice ya construido (síncrono) — usado para pintar los iconos sin esperar
function matchAllTracksInIndex(row, track) {
  if (!musicIndex || !musicIndex.length) return [];
  const artist = g(row, COL.artist);
  const albumTitle = g(row, COL.title);
  const titleNorm = normName(track.title);
  const artistNorm = normName(artist);
  const albumNorm = normName(albumTitle);

  const strong = musicIndex.filter(e => {
    const t = normName(e.title);
    if (!t || t !== titleNorm) return false;
    const a = normName(e.artist), al = normName(e.album);
    return (artistNorm && a.includes(artistNorm)) || (albumNorm && al.includes(albumNorm)) || (!artistNorm && !albumNorm);
  });
  if (strong.length) return strong;

  return musicIndex.filter(e => {
    const t = normName(e.title);
    return t && titleNorm && (t.includes(titleNorm) || titleNorm.includes(t));
  });
}

async function findAudioFileForTrackByName(row, track) {
  const catalog = g(row, COL.catalog);
  const artist = g(row, COL.artist);
  const albumTitle = g(row, COL.title);
  const titleNorm = normName(track.title);
  const posNorm = normName(track.position);
  const folderName = sanitizeFolderName(`(${catalog}) ${artist} - ${albumTitle}`);
  const catalogNorm = normName(catalog);
  const artistNorm = normName(artist);

  async function searchInDir(dirHandle) {
    for await (const [name, handle] of dirHandle.entries()) {
      if (handle.kind === 'file' && /\.(mp3|wav|flac|m4a|aac|ogg)$/i.test(name)) {
        const n = normName(name);
        if ((titleNorm && n.includes(titleNorm)) || (posNorm && n.includes(posNorm))) return handle;
      }
    }
    return null;
  }

  async function searchRoot(musicDir) {
    if (!musicDir) return null;
    try {
      const discFolder = await musicDir.getDirectoryHandle(folderName);
      const found = await searchInDir(discFolder);
      if (found) return found;
    } catch(e) { /* no existe con ese nombre exacto */ }
    for await (const [name, handle] of musicDir.entries()) {
      if (handle.kind === 'directory') {
        const n = normName(name);
        if ((catalogNorm && n.includes(catalogNorm)) || (artistNorm && n.includes(artistNorm))) {
          const found = await searchInDir(handle);
          if (found) return found;
        }
      }
    }
    return await searchInDir(musicDir);
  }

  const musicDir = await getMusicDir();
  const found1 = await searchRoot(musicDir);
  if (found1) return found1;
  const musicDir2 = await getMusicDir2();
  return await searchRoot(musicDir2);
}

async function checkTracksAvailability() {
  await ensureMusicIndex();
  renderView();
}

async function playFileEntry(entry, label) {
  try {
    const file = await entry.handle.getFile();
    const url = URL.createObjectURL(file);
    const player = document.getElementById('track-player');
    if (!player) return;
    player.src = url;
    player.style.display = 'block';
    player.play();
    const lbl = document.getElementById('now-playing-label');
    if (lbl) lbl.textContent = '▶ ' + label;
  } catch(e) {
    showToast('⚠ Error al reproducir el archivo', true);
  }
}

async function playFileEntryByPath(relPath, label) {
  const entry = musicIndex && musicIndex.find(e => e.relPath === relPath);
  if (!entry) return;
  await playFileEntry(entry, label);
}

async function playTrack(idx, trackIndex) {
  const row = allData[idx];
  const releaseId = g(row, COL.release_id);
  if (!releaseId) return;
  const cleanId = releaseId.toString().slice(0, -1);
  const tracklist = tracklistCache[cleanId];
  if (!tracklist || !tracklist[trackIndex]) return;
  const track = tracklist[trackIndex];

  showToast('Buscando "' + track.title + '"...');
  await ensureMusicIndex();
  const matches = matchAllTracksInIndex(row, track);
  if (matches.length) {
    const label = track.position + ' — ' + track.title + (matches.length > 1 ? ` (1 de ${matches.length} encontrados)` : '');
    await playFileEntry(matches[0], label);
    if (matches.length > 1) showToast(`⚠ Hay ${matches.length} archivos que coinciden con este tema — mira el aviso junto al tema`, true);
    renderView();
    return;
  }

  // Sin coincidencia por etiquetas: probar por nombre de archivo/carpeta
  let fileHandle;
  try {
    fileHandle = await findAudioFileForTrackByName(row, track);
  } catch(e) {
    showToast('⚠ Error buscando el archivo', true);
    return;
  }
  if (!fileHandle) {
    showToast('⚠ No encontré el archivo de "' + track.title + '"', true);
    return;
  }
  try {
    const file = await fileHandle.getFile();
    const url = URL.createObjectURL(file);
    const player = document.getElementById('track-player');
    if (!player) return;
    player.src = url;
    player.style.display = 'block';
    player.play();
    const label = document.getElementById('now-playing-label');
    if (label) label.textContent = '▶ ' + track.position + ' — ' + track.title;
  } catch(e) {
    showToast('⚠ Error al reproducir el archivo', true);
  }
}

async function init() {

async function loadData() {
  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'GET' });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Error');
    // Saltar la primera fila (cabecera)
    allData = json.data.slice(1).map(row => row.map(cell => String(cell === null || cell === undefined ? '' : cell)));
    showToast('✓ Datos cargados — ' + allData.length.toLocaleString() + ' registros');
  } catch(e) {
    // Fallback al CSV si falla el Apps Script
    try {
      const res = await fetch(CSV_URL);
      const csv = await res.text();
      allData = parseCSV(csv);
      showToast('✓ Datos cargados (CSV) — ' + allData.length.toLocaleString() + ' registros');
    } catch(e2) {
      allData = [];
      showToast('⚠ No se pudo conectar con Google Sheets', true);
    }
  }
}

function parseCSV(text) {
  const lines = text.split('\n');
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = parseCSVLine(line);
    rows.push(cols);
  }
  return rows;
}

function parseCSVLine(line) {
  const result = [];
  let cur = '';
  let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === ',' && !inQ) {
      result.push(cur.trim()); cur = '';
    } else cur += c;
  }
  result.push(cur.trim());
  return result;
}

function g(row, col) { return (row[col] || '').trim(); }

// ─── FILTERING ────────────────────────────────────────────────────────────────
function isVinyl(row) {
  const fmt = g(row, COL.format).toLowerCase();
  const fuente = g(row, COL.fuente).toLowerCase();
  const isPhysical = fmt.includes('12"') || fmt.includes('7"') || fmt.includes('10"') || fuente === 'discogs';
  return isPhysical;
}

function isDigital(row) {
  const fuente = g(row, COL.fuente).toLowerCase();
  const filename = g(row, COL.filename);
  const destDigital = g(row, COL.digital_estado).toLowerCase();
  const fmt = g(row, COL.format).toLowerCase();
  const isPhysical = fmt.includes('12"') || fmt.includes('7"') || fmt.includes('10"') || fuente === 'discogs';
  // Digital nativo (Engine DJ) O vinilo con digital confirmado
  return fuente === 'engine dj' || filename !== '' || (isPhysical && destDigital === 'confirmado');
}

function getVinyls() {
  return allData.filter(r => isVinyl(r));
}

function getDigital() {
  return allData.filter(r => isDigital(r));
}

function filtered() {
  let data = view === 'vinilos' ? getVinyls() : getDigital();

  if (searchQ) {
    const q = searchQ.toLowerCase();
    data = data.filter(r =>
      g(r, COL.artist).toLowerCase().includes(q) ||
      g(r, COL.title).toLowerCase().includes(q) ||
      g(r, COL.label).toLowerCase().includes(q) ||
      g(r, COL.catalog).toLowerCase().includes(q)
    );
  }

  if (view === 'vinilos') {
    if (filterStatus === 'ripped') data = data.filter(r => g(r, COL.ripeado).toLowerCase() === 'si' || g(r, COL.ripeado).toLowerCase() === 'sí');
    if (filterStatus === 'pending') data = data.filter(r => g(r, COL.ripeado).toLowerCase() !== 'si' && g(r, COL.ripeado).toLowerCase() !== 'sí');
    if (filterStatus === 'you') data = data.filter(r => g(r, COL.ripeado_por).toLowerCase().includes('petrik') || g(r, COL.ripeado_por).toLowerCase() === 'tú' || g(r, COL.ripeado_por).toLowerCase() === 'tu');
    if (filterStatus === 'paquillo') data = data.filter(r => g(r, COL.ripeado_por).toLowerCase().includes('paquillo'));
    if (filterDigital === 'verificar') data = data.filter(r => {
      const n = g(r, COL.notes).toLowerCase();
      return n.includes('mp3') || n.includes('wav') || n.includes('flac') || g(r, COL.digital_estado).toLowerCase() === 'verificar';
    });
    if (filterDigital === 'confirmado') data = data.filter(r => g(r, COL.digital_estado).toLowerCase() === 'confirmado');
    if (filterDigital === 'no') data = data.filter(r => g(r, COL.digital_estado).toLowerCase() === 'no');
  }

  if (filterGenre) data = data.filter(r => g(r, COL.genre).toLowerCase().includes(filterGenre.toLowerCase()));

  data.sort((a, b) => {
    let va = g(a, COL[sortCol] ?? COL.artist);
    let vb = g(b, COL[sortCol] ?? COL.artist);
    return va.localeCompare(vb) * sortDir;
  });

  return data;
}

// ─── STATS ────────────────────────────────────────────────────────────────────
function renderStats() {
  const vinyls = getVinyls();
  const digital = getDigital();
  const ripped = vinyls.filter(r => g(r, COL.ripeado).toLowerCase() === 'si' || g(r, COL.ripeado).toLowerCase() === 'sí').length;
  const pct = vinyls.length ? Math.round(ripped / vinyls.length * 100) : 0;
  document.getElementById('stat-vinilos').textContent = vinyls.length.toLocaleString();
  document.getElementById('stat-ripeados').textContent = ripped.toLocaleString();
  document.getElementById('stat-digital').textContent = digital.length.toLocaleString();
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = pct + '% ripeado';
}

// ─── TEMAS JUNTOS (toda la colección digital) ──────────────────────────────────
let temasJuntosQ = '';

function onTemasJuntosSearch(v) {
  temasJuntosQ = v;
  const pos = v.length;
  renderTemasJuntos();
  requestAnimationFrame(() => {
    const inp = document.getElementById('tj-search-input');
    if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
  });
}

function reindexTemasJuntos() {
  musicIndex = null;
  renderTemasJuntos();
}

async function renderTemasJuntos() {
  const main = document.getElementById('main-content');
  if (!musicDirHandle2) {
    main.innerHTML = `
      <div class="state-center" style="padding:60px 16px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8V6a5 5 0 0 1 10 0v2"/></svg>

        <button class="btn btn-accent" style="margin-top:10px" onclick="setView('config')">Ir a Configuración</button>
      </div>`;
    return;
  }
  if (!musicIndex) {
    main.innerHTML = `
      <div class="state-center" style="padding:60px 16px">
        <p style="text-align:center;margin-bottom:12px">Aún no se ha indexado tu música (leer +6.000 etiquetas puede tardar un rato).</p>

      </div>`;
    return;
  }

  const items = musicIndex.filter(e => e.source === 'juntos');
  const q = normName(temasJuntosQ);
  const rows = q
    ? items.filter(e => normName(e.title).includes(q) || normName(e.artist).includes(q) || normName(e.album).includes(q) || normName(e.relPath).includes(q))
    : items;

  main.innerHTML = `
    <div class="content-header">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="tj-search-input" placeholder="Buscar en tus ${items.length} temas..." value="${temasJuntosQ}" oninput="onTemasJuntosSearch(this.value)">

// ─── BUSCADOR UNIFICADO (¿tengo este tema?) ────────────────────────────────────
let buscadorQ = '';

function onBuscadorSearch(v) {
  buscadorQ = v;
  const pos = v.length;
  renderBuscador();
  requestAnimationFrame(() => {
    const inp = document.getElementById('buscador-input');
    if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
  });
}

function findVinylForDigitalEntry(e) {
  if (!e.album) return null;
  const albumNorm = normName(e.album);
  const artistNorm = normName(e.artist || '');
  return allData.find(r => {
    const tn = normName(g(r, COL.title));
    if (tn !== albumNorm) return false;
    if (!artistNorm) return true;
    const an = normName(g(r, COL.artist));
    return an.includes(artistNorm) || artistNorm.includes(an);
  }) || null;
}

function goToVinylRecord(releaseId) {
  const idx = allData.findIndex(r => g(r, COL.release_id) === releaseId);
  if (idx === -1) return;
  view = 'vinilos';
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-vinilos')?.classList.add('active');
  selectRow(idx);
}

      ${qn && digitalResults.length ? `

  const cards = cortadorSessionDiscs.map((entry, idx) => {
    const tracks = getTracksForSessionDisc(idx);

      coverHtml = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:22px;height:22px;color:var(--text3)"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;

    }

    const tracksHtml = tracks.length === 0

                 ondragleave="event.currentTarget.classList.remove('drop-hover')"

              <span class="track-title" style="white-space:normal;font-weight:500">${t.position ? t.position + ' — ' : ''}${t.title}</span>

function parseDiscogsDuration(str) {
  const m = /^(\d+):(\d+)$/.exec((str || '').trim());
  if (!m) return null;
  return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}

// El usuario arrastra un WAV o FLAC ya cortado por otro medio (Audition, a mano...)
// directamente sobre el nombre de un tema del panel lateral: le metemos las mismas
// etiquetas que pondría el corte automático (título, artista, álbum, pista, año, género,
// sello, catálogo, Discogs ID y carátula) y lo guardamos con el nombre correcto en la
// carpeta de salida. El archivo original que arrastraste no se toca — se genera uno nuevo,
// igual que hace el corte automático, conservando el mismo formato que soltaste.
async function handleCortadorTrackDrop(event, discIdx, trackIdx) {
  event.preventDefault();
  event.currentTarget.classList.remove('drop-hover');
  const file = event.dataTransfer.files && event.dataTransfer.files[0];
  if (!file) return;
  const isWav = /\.wav$/i.test(file.name);
  const isFlac = /\.flac$/i.test(file.name);
  if (!isWav && !isFlac) {
    showToast('⚠ Solo se pueden arrastrar archivos .wav o .flac', true);
    return;
  }
  if (!cortadorOutDirHandle) {
    showToast('⚠ Antes elige la carpeta de salida (paso 2)', true);
    return;
  }
  const tracks = getTracksForSessionDisc(discIdx);
  const track = tracks[trackIdx];
  if (!track) return;
  try {
    showToast(`Etiquetando "${track.title}"...`);
    const buf = await file.arrayBuffer();
    const ext = isFlac ? '.flac' : '.wav';
    const tagged = isFlac ? await embedTagsInFlac(buf, track) : await embedTagsInWav(buf, track);
    let baseName = buildTrackFileName(track, trackIdx);
    const outHandle = await cortadorOutDirHandle.getFileHandle(baseName + ext, { create: true });
    const writable = await outHandle.createWritable();
    await writable.write(tagged);
    await writable.close();
    showToast(`✓ ${baseName}${ext} guardado con etiquetas`);
  } catch(e) {
    console.error(e);
    showToast('⚠ Error al etiquetar el archivo: ' + e.message, true);
  }
}

// Junta las duraciones esperadas de todos los discos de la sesión, en orden
// Temas esperados de UN solo disco de la sesión (misma lógica que getCortadorExpectedTracks,
// pero para uno solo — la usan tanto el cálculo global como el panel de trabajo lateral).
function getTracksForSessionDisc(idx) {
  const entry = cortadorSessionDiscs[idx];
  if (!entry) return [];
  if (entry.manual) {
    const discName = entry.title;
    const arr = [];
    for (let i = 0; i < entry.trackCount; i++) {
      arr.push({ disc: discName, position: String(i + 1), title: `${discName} — tema ${i + 1}`, durationSec: null, row: null });
    }
    return arr;
  }
  const releaseId = g(entry.row, COL.release_id);
  const cleanId = releaseId.toString().slice(0, -1);
  const tl = tracklistCache[cleanId];
  if (!tl) return []; // aún no ha llegado de Discogs
  const discTitle = g(entry.row, COL.title);
  const discTracks = tl.map(t => ({ disc: discTitle, position: t.position, title: t.title, durationSec: parseDiscogsDuration(t.duration), row: entry.row }));
  if (entry.countOverride && entry.countOverride > discTracks.length) {
    for (let i = discTracks.length; i < entry.countOverride; i++) {
      discTracks.push({ disc: discTitle, position: String(i + 1), title: `${discTitle} — tema ${i + 1} (no está en Discogs)`, durationSec: null, row: entry.row });
    }
  }
  return discTracks;
}

function getCortadorExpectedTracks() {
  const expected = [];
  for (let i = 0; i < cortadorSessionDiscs.length; i++) {
    expected.push(...getTracksForSessionDisc(i));
  }
  return expected;
}

async function loadCoverForRow(row) {
  const releaseId = g(row, COL.release_id);
  if (!releaseId) return null;
  // Quitar último dígito del release_id (formato del Sheet tiene un 0 extra)
  const cleanId = releaseId.toString().slice(0, -1);
  if (coverCache[cleanId] !== undefined) return coverCache[cleanId];
  try {
    const res = await fetch(`https://api.discogs.com/releases/${cleanId}`, { headers: DISCOGS_HEADERS });
    const data = await res.json();
    const images = data.images || [];
    const primary = images.find(i => i.type === 'primary');
    const img = (primary && primary.uri) || (images[0] && images[0].uri) || null;
    coverCache[cleanId] = img;
    return img;
  } catch(e) { coverCache[cleanId] = null; return null; }
}

const tracklistCache = {};

async function loadCoverForRow(row) {
  const releaseId = g(row, COL.release_id);
  if (!releaseId) return null;
  // Quitar último dígito del release_id (formato del Sheet tiene un 0 extra)
  const cleanId = releaseId.toString().slice(0, -1);
  if (coverCache[cleanId] !== undefined) return coverCache[cleanId];
  try {
    const res = await fetch(`https://api.discogs.com/releases/${cleanId}`, { headers: DISCOGS_HEADERS });
    const data = await res.json();
    const images = data.images || [];
    const primary = images.find(i => i.type === 'primary');
    const img = (primary && primary.uri) || (images[0] && images[0].uri) || null;
    coverCache[cleanId] = img;
    tracklistCache[cleanId] = (data.tracklist || []).map(t => ({
      position: t.position || '', title: t.title || '', duration: t.duration || ''
    }));
    return img;
  } catch(e) {
    coverCache[cleanId] = null;
    tracklistCache[cleanId] = null;
    return null;
  }
}

async function postToSheet(row, fields) {
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({
      releaseId: g(row, COL.release_id),
      artist: g(row, COL.artist),
      title: g(row, COL.title),
      fields: fields,
    }),
  });
}

async function verifySaved(row, fields) {
  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'GET' });
    const json = await res.json();
    if (!json.ok) return false;
    const releaseId = g(row, COL.release_id);
    const dataRows = json.data.slice(1);
    const match = dataRows.find(r => String(r[COL.release_id] ?? '').trim() === releaseId);
    if (!match) return false;
    return fields.every(f => String(match[f.col] ?? '').trim() === String(f.value ?? '').trim());
  } catch(e) {
    return false;
  }
}

async function saveToSheet(idx) {
  const row = allData[idx];
  const fields = [
    { col: COL.ripeado,        value: row[COL.ripeado]        || '' },
    { col: COL.ripeado_por,    value: row[COL.ripeado_por]    || '' },
    { col: COL.digital_estado, value: row[COL.digital_estado] || '' },
    { col: COL.kallax_slot,    value: row[COL.kallax_slot]    || '' },
    { col: COL.cantidad,       value: row[COL.cantidad]       || '' },
    { col: COL.estado_fisico,  value: row[COL.estado_fisico]  || '' },
    { col: COL.corte_problema, value: row[COL.corte_problema] || '' },
    { col: COL.formato_rip,    value: row[COL.formato_rip]    || '' },
    { col: COL.limpio,         value: row[COL.limpio]         || '' },
    { col: COL.fecha_limpieza, value: row[COL.fecha_limpieza] || '' },
  ];
  showToast('Guardando...');
  try {
    await postToSheet(row, fields);
    await new Promise(r => setTimeout(r, 1200));
    let ok = await verifySaved(row, fields);
    if (!ok) {
      // No se confirmó — reintento automático una vez
      await postToSheet(row, fields);
      await new Promise(r => setTimeout(r, 1200));
      ok = await verifySaved(row, fields);
    }
    if (ok) {
      showToast('✓ Guardado y confirmado en Sheet');
    } else {
      showToast('⚠ No se pudo confirmar el guardado — vuelve a intentarlo', true);
    }
  } catch(e) {
    console.error('Error guardando en Sheet:', e);
    showToast('⚠ Error guardando', true);
  }
}

  if (q.length < 2) { showToast('⚠ Escribe artista o título primero', true); return; }

  try {
    const res = await fetch(`https://api.discogs.com/database/search?q=${encodeURIComponent(q)}&type=release&per_page=6&format=Vinyl`, {
      headers: DISCOGS_HEADERS
    });
    const data = await res.json();
    const results = (data.results || []).slice(0, 6);
    const box = document.getElementById('discogs-results');
    if (results.length === 0) { box.innerHTML = '<div style="padding:12px;font-size:12px;color:var(--text3)">Sin resultados en Discogs</div>'; }
    else {
      box.innerHTML = `<div class="discogs-box">${results.map((r,i) => `
        <div class="discogs-item" onclick="selectDiscogs(${i},'${escJ(r.title)}','${escJ(r.year||'')}','${escJ((r.label&&r.label[0])||'')}','${escJ(r.catno||'')}','${escJ(r.thumb||'')}')">

          <div class="discogs-info">
            <div class="discogs-title">${r.title}</div>
            <div class="discogs-meta">${r.year||''}${r.label&&r.label[0]?' · '+r.label[0]:''}</div>
          </div>
        </div>`).join('')}</div>`;
    }
    box.style.display = 'block';
  } catch(e) {
    showToast('⚠ Error conectando con Discogs', true);
  }
  document.getElementById('discogs-btn-label').textContent = 'Buscar en Discogs';
}

function escJ(s) { return (s||'').replace(/'/g,"\\'").replace(/\n/g,' '); }

      showToast('✓ Carátula cargada');
    } else showToast('Sin carátula en Discogs para este release', true);
  } catch(e) { showToast('Error al buscar carátula', true); }
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function showToast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'flex';
  el.style.borderColor = isErr ? 'var(--red)' : 'var(--border2)';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2500);
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => showToast('✓ Enlace copiado'));
}


// ─── KALLAX ───────────────────────────────────────────────────────────────────
// true = hueco con vinilos, false = vacío/no usado
const KALLAX_2x4 = [
  [null, null, 2,  1], // fila 1: huecos 1 y 2 (derecha a izquierda)
  [null, 5,    4,  3], // fila 2: huecos 3, 4, 5
];
const KALLAX_4x4 = [
  [9,    8,    7,  6 ], // fila 1: huecos 6-9
  [null, 12,   11, 10], // fila 2: huecos 10-12
  [null, 15,   14, 13], // fila 3: huecos 13-15
  [null, null, null, null], // fila 4: no se usa
];

function renderKallax(selectedSlot, onSelect) {
  // Construir mapa de huecos ocupados
  const occupied = {};
  allData.forEach(r => {
    const slot = g(r, COL.kallax_slot);
    if (slot) occupied[slot] = true;
  });

  function grid(matrix, label) {
    const cols = matrix[0].length;
    return `<div class="kallax-unit">
      <div class="kallax-label">${label}</div>
      <div class="kallax-grid" style="grid-template-columns:repeat(${cols},1fr)">
        ${matrix.map(row => row.map(slot => {
          if (slot === null) return `<div class="kc empty"></div>`;
          const isSel = String(selectedSlot) === String(slot);
          const isOcc = occupied[slot] && !isSel;
          return `<div class="kc ${isSel ? 'on' : isOcc ? 'occupied' : ''}" onclick="${onSelect}(${slot})" title="Hueco ${slot}">${slot}</div>`;
        }).join('')).join('')}
      </div>
    </div>`;
  }

  return `<div class="kallax-section">
    ${grid(KALLAX_2x4, 'Kallax 2×4 (arriba)')}
    ${grid(KALLAX_4x4, 'Kallax 4×4 (abajo)')}
  </div>`;
}

function setKallaxSlot(idx, slot) {
  allData[idx][COL.kallax_slot] = String(slot);
  selectedRow = allData[idx];
  renderView();
  showToast('\u2713 Ubicado en hueco ' + slot);
  saveToSheet(idx);
}

// ─── SEARCH ──────────────────────────────────────────────────────────────────
function onSearch(val) {
  searchQ = val;
  const pos = val.length;
  renderView();
  // Restaurar foco y posición del cursor después del render
  requestAnimationFrame(() => {
    const inp = document.getElementById('search-input');
    if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
  });
}

// ─── START ────────────────────────────────────────────────────────────────────
init();
</script>
